<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Chicago Rail - Metra Train Tracker & Schedule</title>
    <meta name="description" content="Track Metra train departures and arrivals in real-time. View schedules, plan trips, and never miss your Chicago commuter train." />

    <meta name="author" content="Chicago Rail" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Open Graph / Facebook -->

    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Chicago Rail" />
    <meta property="og:title" content="Chicago Rail - Metra Train Tracker & Schedule" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Chicago Rail - Metra Train Tracker & Schedule" />

    <meta name="twitter:image" content="/icon.png" />
    <meta name="twitter:image:alt" content="Chicago Rail logo" />

    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="theme-color" content="#5BC2E7" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Chicago Rail" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Chicago Rail",
      "alternateName": "Chicago Rail Metra Tracker",
      "description": "Track Metra train departures and arrivals in real-time. View schedules, plan trips, and never miss your Chicago commuter train.",
      "applicationCategory": "TravelApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires a modern web browser",
      "image": "/icon.png",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Organization",
        "name": "Chicago Rail"
      },
      "about": {
        "@type": "TransitMap",
        "name": "Metra Commuter Rail Schedule",
        "description": "Real-time Metra commuter train departure and arrival schedules for the Chicago metropolitan area"
      },
      "areaServed": {
        "@type": "City",
        "name": "Chicago",
        "containedInPlace": {
          "@type": "State",
          "name": "Illinois"
        }
      },
      "keywords": "Metra, Chicago, train schedule, commuter rail, departures, arrivals, trip planner"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
